
spring.application.name=Proyecto_Avanzada

# Datasource: prefer environment variables for Postgres; otherwise fall back to H2 in-memory
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:default;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# If you want to use Postgres locally, set these environment variables before running:
# SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/tu_bd
# SPRING_DATASOURCE_USERNAME=usuario
# SPRING_DATASOURCE_PASSWORD=clave

# Server port (changed to 8082 to avoid conflicts on 8080)
server.port=8082
