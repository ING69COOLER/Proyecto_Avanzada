<div class="solicitudes-list">
  <h2>Solicitudes</h2>
  <div *ngIf="mensaje" class="mensaje">{{ mensaje }}</div>
  <a routerLink="/solicitudes/crear">Crear nueva solicitud</a>
  <ul>
    <li *ngFor="let s of solicitudes">
      <a [routerLink]="['/solicitudes', s.codigo]">#{{ s.codigo }} - {{ s.tipo }} - {{ s.estado }}</a>
    </li>
  </ul>
</div>
