# ==========================================
# Ejemplo de Configuración para RF-09
# ==========================================
# 
# IMPORTANTE: Este archivo es un ejemplo
# Para usar, copia este contenido a application.properties
# o crea un archivo application-prod.properties
#
# NUNCA commites tu API key en el repositorio
# Usa variables de entorno en su lugar

# ==========================================
# OpenAI Configuration - RF-09
# ==========================================

# Tu API key de OpenAI (obtén una en https://platform.openai.com/api-keys)
# MEJOR: Configura como variable de entorno SPRING_AI_OPENAI_API_KEY
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}

# Modelo a usar
# Opciones: gpt-4, gpt-4-turbo, gpt-4o, gpt-4o-mini, gpt-3.5-turbo
# Recomendado: gpt-4o-mini (más rápido y económico)
spring.ai.openai.chat.options.model=gpt-4o-mini

# Temperatura (0.0 = determinístico, 1.0 = creativo)
# Para resúmenes: 0.7 es un buen balance
spring.ai.openai.chat.options.temperature=0.7

# Tokens máximos para respuesta
spring.ai.openai.chat.options.max-tokens=500

# ==========================================
# Base de Datos
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/proyecto_avanzada
spring.datasource.username=postgres
spring.datasource.password=admin

# ==========================================
# Servidor
# ==========================================

server.port=8082
spring.application.name=Proyecto_Avanzada
