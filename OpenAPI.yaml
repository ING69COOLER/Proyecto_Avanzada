openapi: 3.0.3
info:
  title: API de Gestión de Solicitudes Académicas
  version: 1.0.0
  description: >
    API REST para gestionar solicitudes académicas de la Universidad del Quindío.
    Todas las operaciones sensibles requieren autenticación mediante token JWT
    en el encabezado `Authorization: Bearer <token>`.
    Primero debe autenticarse en `/api/login` para obtener el token.

servers:
  - url: http://SMCTriageAcademicApplicationService/api

tags:
  - name: Autenticación
  - name: Usuarios
  - name: Solicitudes

paths:
  /api/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión y obtener token JWT
      description: >
        Autentica a un usuario mediante su identificación y contraseña.
        Retorna un token JWT que debe ser incluido en el encabezado `Authorization`
        para las demás operaciones. Este endpoint es público.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identificacion, password]
              properties:
                identificacion:
                  type: string
                  description: Identificación del usuario (ej. cédula)
                password:
                  type: string
                  format: password
                  description: Contraseña del usuario
      responses:
        '200':
          description: Autenticación exitosa - retorna el token JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Token JWT para usar en las siguientes peticiones
                  type:
                    type: string
                    example: Bearer
                  expiresIn:
                    type: integer
                    description: Tiempo de expiración en segundos
                    example: 3600
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/usuario/registro:
    post:
      tags: [Usuarios]
      summary: Registrar usuario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/usuario/{identificacion}:
    get:
      tags: [Usuarios]
      summary: Obtener usuario por identificación
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: identificacion
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/solicitudes:
    post:
      tags: [Solicitudes]
      summary: Registrar solicitud
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearSolicitudRequest'
      responses:
        '201':
          description: Solicitud registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/solicitudes/estado:
    get:
      tags: [Solicitudes]
      summary: Consultar solicitudes por Estado
      description: se envia un schema de enum de Estado y con base a esto se obtiene una respuesta
      parameters:
        - name: estado
          in: query
          required: true
          description: Estado de la solicitud
          schema:
            $ref: '#/components/schemas/EstadoSolicitud'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de solicitudes 
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/solicitudes/tipo:
    get:
      tags: [Solicitudes]
      summary: Consultar solicitudes por Tipo
      description: se envia un schema de enum de tiposolicitud y con base a esto se obtiene una respuesta
      parameters:
        - name: estado
          in: query
          required: true
          description: tipo de la solicitud
          schema:
            $ref: '#/components/schemas/TipoSolicitud'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de solicitudes 
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/solicitudes/prioridad:
    get:
      tags: [Solicitudes]
      summary: Consultar solicitudes por prioridad
      description: se envia un schema de enum de prioridad y con base a esto se obtiene una respuesta
      parameters:
        - name: estado
          in: query
          required: true
          description: tipo de la solicitud
          schema:
            $ref: '#/components/schemas/NivelPrioridad'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de solicitudes 
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/solicitudes/responsable:
    get:
      tags: [Solicitudes]
      summary: Consultar solicitudes por responsable a la hora de crearla
      description: se envia un schema de enum de prioridad y con base a esto se obtiene una respuesta, se realiza mediante identificacion
      parameters:
        - name: responsable
          in: query
          required: true
          description: tipo de la solicitud
          schema:
            type: integer
            format: int64
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de solicitudes 
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/solicitudes/{id}:
    get:
      tags: [Solicitudes]
      summary: Obtener solicitud por id
      
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Solicitud encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/solicitudes/{id}/clasificacion:
    patch:
      tags: [Solicitudes]
      summary: Clasificar solicitud
      
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasificarSolicitudRequest'
      responses:
        '200':
          description: Solicitud clasificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/solicitudes/{id}/prioridad:
    patch:
      tags: [Solicitudes]
      summary: Priorizar solicitud
      
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorizarSolicitudRequest'
      responses:
        '200':
          description: Prioridad actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/solicitudes/{id}/asignacion:
    patch:
      tags: [Solicitudes]
      summary: Asignar responsable a solicitud
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarSolicitudRequest'
      responses:
        '200':
          description: Responsable asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/solicitudes/{id}/atencion:
    patch:
      tags: [Solicitudes]
      summary: Atender solicitud
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtenderSolicitudRequest'
      responses:
        '200':
          description: Solicitud atendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/solicitudes/{id}/cierre:
    patch:
      tags: [Solicitudes]
      summary: Cerrar solicitud
      
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CerrarSolicitudRequest'
      responses:
        '200':
          description: Solicitud cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/solicitudes/{id}/historial:
    get:
      tags: [Solicitudes]
      summary: Consultar historial de una solicitud
      
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Historial de la solicitud
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistorialSolicitudResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /api/solicitudes/{id}/resumen:
    get:
      tags: [Solicitudes]
      summary: consultar resumen de la solicitud
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Historial de la solicitud
          content:
            application/json:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      
  schemas:
    Rol:
      type: string
      enum: [ESTUDIANTE, ADMINISTRATIVO, COORDINADOR, DOCENTE]

    EstadoSolicitud:
      type: string
      enum: [REGISTRADA, CLASIFICADA, EN_ATENCION, ATENDIDA, CERRADA]

    TipoSolicitud:
      type: string
      enum:
        - REGISTRO_ASIGNATURA
        - HOMOLOGACION
        - CANCELACION_ASIGNATURA
        - SOLICITUD_CUPOS
        - CONSULTA_ACADEMICA

    CanalOrigen:
      type: string
      enum:
        - CSU
        - SAC
        - EMAIL
        - PRESENCIAL
        - TELEFONO
        - PORTAL_WEB
        - CORREO_CERTIFICADO

    NivelPrioridad:
      type: string
      enum: [ALTA, MEDIA, BAJA]

    CrearUsuarioRequest:
      type: object
      required: [nombre, identificacion, correo, activo, rol]
      properties:
        nombre:
          type: string
        identificacion:
          type: string
        correo:
          type: string
          format: email
        activo:
          type: boolean
        rol:
          $ref: '#/components/schemas/Rol'

    UsuarioResponse:
      type: object
      properties:
        nombre:
          type: string
        identificacion:
          type: string
        correo:
          type: string
        activo:
          type: boolean
        rol:
          $ref: '#/components/schemas/Rol'

    CrearSolicitudRequest:
      type: object
      required: [tipo, descripcion, canalOrigen, usuario]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoSolicitud'
        descripcion:
          type: string
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        usuario:
          $ref: '#/components/schemas/UsuarioResponse'

    ClasificarSolicitudRequest:
      type: object
      required: [tipoSolicitud, usuarioIdentificacion, observacion]
      properties:
        tipoSolicitud:
          $ref: '#/components/schemas/TipoSolicitud'
        usuarioIdentificacion:
          type: string
        observacion:
          type: string

    PriorizarSolicitudRequest:
      type: object
      required: [nivelPrioridad, justificacion, usuarioIdentificacion]
      properties:
        nivelPrioridad:
          $ref: '#/components/schemas/NivelPrioridad'
        justificacion:
          type: string
        usuarioIdentificacion:
          type: string

    AsignarSolicitudRequest:
      type: object
      required: [usuarioIdentificacion, observacion]
      properties:
        usuarioIdentificacion:
          type: string
        observacion:
          type: string

    AtenderSolicitudRequest:
      type: object
      required: [usuarioIdentificacion, observacion]
      properties:
        usuarioIdentificacion:
          type: string
        observacion:
          type: string

    CerrarSolicitudRequest:
      type: object
      required: [usuarioIdentificacion, observacion]
      properties:
        usuarioIdentificacion:
          type: string
        observacion:
          type: string

    PrioridadResponse:
      type: object
      properties:
        nivel:
          $ref: '#/components/schemas/NivelPrioridad'
        justificacion:
          type: string

    SolicitudResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tipo:
          $ref: '#/components/schemas/TipoSolicitud'
        descripcion:
          type: string
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        fechaHoraRegistro:
          type: string
          format: date-time
        fechaCierre:
          type: string
          format: date-time
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        usuarioSolicitante:
          $ref: '#/components/schemas/UsuarioResponse'
        prioridad:
          $ref: '#/components/schemas/PrioridadResponse'

    HistorialSolicitudResponse:
      type: object
      properties:
        fechaHora:
          type: string
          format: date-time
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        accion:
          type: string
        responsable:
          $ref: '#/components/schemas/UsuarioResponse'
        observacion:
          type: string

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: No autenticado - Token JWT inválido o ausente. Debe incluir el token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Operación no autorizada para el rol actual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'